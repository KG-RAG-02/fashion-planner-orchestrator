services:
  orchestrator:
    build: .
    image: vogue-orchestrator:local
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      VOGUE_ORCHESTRATOR_HOST: "0.0.0.0"
      VOGUE_ORCHESTRATOR_PORT: "8765"
      VOGUE_ORCHESTRATOR_ALLOW_REMOTE_BIND: "1"
    read_only: true
    volumes:
      - run-data:/app/.local
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  run-data:
