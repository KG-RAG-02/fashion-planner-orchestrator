# 오프라인 테스트와 생성물 검사. 외부 서비스·유료 API·형제 레포 없이 돈다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 기획서 PNG 테스트용 한글 글꼴(컨테이너 이미지와 같은 패키지)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-nanum
      - name: 설치
        run: python -m pip install -e '.[workflow,query]'
      - name: Python 테스트
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: UI 모델 테스트
        run: node --test web/tests/model.test.mjs
      - name: 계약 기준선과 스냅샷
        run: python scripts/freeze_workflow_contract.py --check
      - name: 계약 레지스트리(형제 레포가 없으면 해당 항목은 건너뛴다)
        run: PYTHONPATH=src python scripts/export_agent_contracts.py --check
      - name: 생성물이 원본과 같은지
        run: |
          PYTHONPATH=src python scripts/render_query_prompt.py --check
          PYTHONPATH=src python scripts/export_structured_query_schema.py --check
          python scripts/generate_query_vocabulary.py --check
          python scripts/generate_alias_data.py --check
