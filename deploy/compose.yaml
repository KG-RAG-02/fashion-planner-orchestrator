# Fashion Planner — integrated deployment (base layer).
#
# Never run this file alone: use deploy/bin/fashion-planner {stub|rehearsal|live}, which adds
#   compose.stub.yaml  (deterministic, offline)      or
#   compose.data.yaml  (Neo4j Aura + Cloudflare R2)  [+ compose.paid.yaml for the single live run]
# and the env file ~/.config/fashion-planner/fashion-planner.env (created by `fashion-planner init-env`).
#
# Topology: only the orchestrator is published (127.0.0.1); services talk over the internal
# `backend` network with the shared bearer token; artifacts are exchanged through read-only
# volume subpaths and verified by size + sha256.

name: fashion-planner

x-app: &app
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=128m,mode=1777
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-env: &env
  HOME: /tmp
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  FASHION_PLANNER_SERVICE_TOKEN: ${FASHION_PLANNER_SERVICE_TOKEN:?run deploy/bin/fashion-planner init-env first}

networks:
  backend:
    internal: true
  edge:
    ipam:
      config:
        - subnet: ${FASHION_PLANNER_EDGE_SUBNET:-172.30.231.0/28}
  egress: {}

volumes:
  orchestrator_state:
    name: fashion-planner_${FASHION_PLANNER_RUN_LABEL:-default}_orchestrator_state
  novelty_data:
    name: fashion-planner_${FASHION_PLANNER_RUN_LABEL:-default}_novelty_data
  research_state:
    name: fashion-planner_${FASHION_PLANNER_RUN_LABEL:-default}_research_state

services:
  volume-init:
    image: fashion-planner/orchestrator:dev
    build: { context: .., dockerfile: Dockerfile }
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /v/orchestrator/workflow/blobs /v/research/hm-cache /v/research/duckdb-tmp
        /v/novelty/novelty-artifacts/images &&
        chown -R 10001:10001 /v/orchestrator /v/research /v/novelty &&
        chmod 0750 /v/orchestrator /v/research /v/novelty && echo volume-init-ok
    volumes:
      - orchestrator_state:/v/orchestrator
      - research_state:/v/research
      - novelty_data:/v/novelty
    restart: "no"

  trend:
    <<: *app
    image: fashion-planner/trend:dev
    build: { context: ../../fashion-planner-trend, dockerfile: docker/demo/Dockerfile.app }
    environment:
      <<: *env
      TREND_API_MODE: service
      TREND_API_HOST: 0.0.0.0
      TREND_API_PORT: "8768"
    networks: [backend]
    restart: on-failure
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8768/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  inventory:
    <<: *app
    image: fashion-planner/inventory:dev
    build: { context: ../../fashion-planner-inventory }
    environment:
      <<: *env
      INVENTORY_CACHE_DIR: /cache
      INVENTORY_IMAGE_CACHE_DIR: /tmp/inventory-images
      # Whole-request deadline of the inventory routes (service default 60 s). Trends are processed one after
      # another, so a run with many trends needs longer; 3 minutes covered the longest observed run.
      INVENTORY_HANDOFF_TIMEOUT_SECONDS: "180"
    networks: [backend]
    mem_limit: 2g

  novelty:
    <<: *app
    image: fashion-planner/novelty:dev
    build: { context: ../../fashion-planner-novelty }
    environment:
      <<: *env
      NOVELTY_HTTP_MODE: private
      NOVELTY_HOST: 0.0.0.0
      NOVELTY_PORT: "8767"
      # novelty makes the product and worn-outfit images inside the draft call (draft_with_visuals).
      # synthetic = deterministic offline PNGs marked SYNTHETIC (no key, no cost); compose.paid.yaml switches to openai.
      NOVELTY_DRAFT_IMAGE_PROVIDER: synthetic
      NOVELTY_DRAFT_ARTIFACT_DIR: /app/data/local/novelty-artifacts
    volumes:
      - novelty_data:/app/data/local
    networks: [backend]
    mem_limit: 512m
    # In private mode /api/health also needs the bearer token.
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,sys,urllib.request as u; r=u.Request('http://127.0.0.1:8767/api/health', headers={'Authorization': 'Bearer ' + os.environ['FASHION_PLANNER_SERVICE_TOKEN']}); sys.exit(0 if u.build_opener(u.ProxyHandler({})).open(r, timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      volume-init: { condition: service_completed_successfully }

  research:
    <<: *app
    image: fashion-planner/research:dev
    build: { context: ../../fashion-planner-research }
    environment:
      <<: *env
      RESEARCH_DISABLE_DOTENV: "1"
      # research gives its H&M age query a DuckDB memory_limit of RESEARCH_AGE_DUCKDB_MEMORY_LIMIT (service
      # default 3GB). Over R2 in a Linux container 1 GB ran out of memory, so the container gets 3g and DuckDB
      # 2GB of it, leaving room for the Python process and the price query. Past 2GB DuckDB spills to
      # RESEARCH_AGE_DUCKDB_TEMP_DIRECTORY (default $RESEARCH_CACHE_DIR/duckdb-age-tmp, writable where
      # compose.data.yaml mounts the cache; without R2 settings, as in stub, the query does not run).
      RESEARCH_AGE_DUCKDB_MEMORY_LIMIT: "2GB"
    volumes:
      # DuckDB spills to "<cwd>/.tmp" (= /app/.tmp) when an R2 aggregate exceeds its memory limit; the
      # read-only root filesystem refuses that directory (IOException), so give it a writable disk path.
      - type: volume
        source: research_state
        target: /app/.tmp
        volume: { subpath: duckdb-tmp }
    networks: [backend]
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8766/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      volume-init: { condition: service_completed_successfully }

  orchestrator:
    <<: *app
    image: fashion-planner/orchestrator:dev
    build: { context: .., dockerfile: Dockerfile }
    environment:
      <<: *env
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: "8765"
      ORCHESTRATOR_ALLOW_REMOTE_BIND: "1"
      ORCHESTRATOR_RUNTIME: container
      ORCHESTRATOR_TRUSTED_PEER_CIDRS: ${FASHION_PLANNER_EDGE_SUBNET:-172.30.231.0/28}
      ORCHESTRATOR_ALLOWED_HOSTS: 127.0.0.1:${FASHION_PLANNER_UI_PORT:-8765},localhost:${FASHION_PLANNER_UI_PORT:-8765}
      ORCHESTRATOR_HTTP_PRIVATE_HOSTS: trend,inventory,novelty,research
      ORCHESTRATOR_TREND_URL: http://trend:8768
      ORCHESTRATOR_INVENTORY_URL: http://inventory:8002
      ORCHESTRATOR_NOVELTY_URL: http://novelty:8767
      ORCHESTRATOR_RESEARCH_URL: http://research:8766
      ORCHESTRATOR_WORKFLOW_STORE_DIR: /app/.local/workflow
      ORCHESTRATOR_PEER_ARTIFACT_ROOT: /peer
      ORCHESTRATOR_WORKFLOW_READ_TIMEOUT_SECONDS: "75"
      # Above the inventory deadline (180 s) so its TIMEOUT envelope arrives before the orchestrator gives up.
      ORCHESTRATOR_WORKFLOW_INVENTORY_READ_TIMEOUT_SECONDS: "210"
      # novelty generates two images inside the draft call; only that read waits longer.
      ORCHESTRATOR_WORKFLOW_DRAFT_MODE: draft_with_visuals
      ORCHESTRATOR_WORKFLOW_DRAFT_READ_TIMEOUT_SECONDS: "600"
      ORCHESTRATOR_WORKFLOW_IMAGES_ENABLED: "1"
      # Stage 06 composes the planning sheet locally; the orchestrator never calls an image model.
      ORCHESTRATOR_WORKFLOW_IMAGE_PROVIDER: planning_sheet
      # Off by default; `fashion-planner image-retry <profile> <request_id>` turns it on for one re-composition.
      ORCHESTRATOR_WORKFLOW_IMAGE_RETRY_ENABLED: ${ORCHESTRATOR_WORKFLOW_IMAGE_RETRY_ENABLED:-0}
      ORCHESTRATOR_QUERY_STRUCTURING_MODE: synthetic_fixture
    ports:
      - "127.0.0.1:${FASHION_PLANNER_UI_PORT:-8765}:8765"
    volumes:
      - orchestrator_state:/app/.local
      # novelty draft visuals: artifact://novelty/images/<sha256>.<ext>, verified by size + sha256 on import.
      - type: volume
        source: novelty_data
        target: /peer/novelty
        read_only: true
        volume: { subpath: novelty-artifacts }
    networks: [edge, backend]
    mem_limit: 512m
    depends_on:
      volume-init: { condition: service_completed_successfully }
      trend: { condition: service_healthy }
      inventory: { condition: service_healthy }
      novelty: { condition: service_healthy }
      research: { condition: service_healthy }
