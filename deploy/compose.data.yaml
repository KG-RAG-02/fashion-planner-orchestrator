# Real-data layer: Neo4j Aura (trend graph) + Cloudflare R2 (inventory and H&M DuckDB caches).
#   deploy/bin/fashion-planner rehearsal   (this layer alone: zero paid model calls, synthetic images)
#   deploy/bin/fashion-planner live        (plus compose.paid.yaml)
# Cache volumes are fixed-name so a ~0.8 GB download happens once and survives restarts.

x-r2: &r2
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID missing in the env file}
  R2_BUCKET: ${R2_BUCKET:?R2_BUCKET missing in the env file}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID missing in the env file}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY missing in the env file}
  R2_ENDPOINT: ${R2_ENDPOINT:-}
  R2_DB_KEY: ${R2_DB_KEY:?R2_DB_KEY missing in the env file}
  R2_IMAGE_PREFIX: ${R2_IMAGE_PREFIX:-}

services:
  trend:
    environment:
      NEO4J_URI: ${NEO4J_URI:?fill NEO4J_URI (Neo4j Aura) in the env file}
      NEO4J_USER: ${NEO4J_USER:?fill NEO4J_USER in the env file}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?fill NEO4J_PASSWORD in the env file}
    networks: [backend, egress]

  inventory-cache-init:
    image: fashion-planner/inventory:dev
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m,mode=1777"]
    environment:
      <<: *r2
      HOME: /tmp
      INVENTORY_CACHE_DIR: /cache
      # Optional: with R2_CLIP_INDEX_KEY, --prepare-cache also caches the inventory CLIP index next to the DB.
      R2_CLIP_INDEX_KEY: ${R2_CLIP_INDEX_KEY:-}
    command: ["python", "-m", "fashion_planner_inventory.server", "--prepare-cache"]
    volumes:
      - inventory_cache:/cache
    networks: [egress]
    restart: "no"

  inventory:
    environment:
      <<: *r2
      INVENTORY_CACHE_DIR: /cache
      # CLIP filter (inventory README): the cached index, Musinsa snap photos on R2, and the open_clip weights
      # (HF hub, ~350 MB) kept on a volume because /tmp is a 128 MB tmpfs. Empty keys leave CLIP off.
      R2_CLIP_INDEX_KEY: ${R2_CLIP_INDEX_KEY:-}
      R2_SNAP_IMAGE_PREFIX: ${R2_SNAP_IMAGE_PREFIX:-}
      HF_HOME: /models/hf
    volumes:
      - inventory_cache:/cache:ro
      - inventory_models:/models
    networks: [backend, egress]
    depends_on:
      inventory-cache-init: { condition: service_completed_successfully }

  research:
    environment:
      <<: *r2
      RESEARCH_CACHE_DIR: /data/hm-cache
      # research reads its H&M age, price and fabric research from one precomputed aggregate snapshot;
      # the env file supplies its content-addressed R2 key.
      RESEARCH_AGGREGATE_SNAPSHOT_KEY: ${RESEARCH_AGGREGATE_SNAPSHOT_KEY:?research aggregate snapshot key is required for rehearsal/live}
      # Deployer opt-in: H&M Kaggle data is for non-commercial research only (research reads it only when 1).
      RESEARCH_HM_NONCOMMERCIAL_RESEARCH: ${RESEARCH_HM_NONCOMMERCIAL_RESEARCH:-0}
    volumes:
      # Writable: it also holds the H&M age query's DuckDB spill directory (research default
      # RESEARCH_AGE_DUCKDB_TEMP_DIRECTORY=$RESEARCH_CACHE_DIR/duckdb-age-tmp; memory limit set in compose.yaml).
      - type: volume
        source: research_state
        target: /data/hm-cache
        volume: { subpath: hm-cache }
    networks: [backend, egress]

volumes:
  inventory_cache:
    name: fashion-planner_inventory_cache
  inventory_models:
    name: fashion-planner_inventory_models
