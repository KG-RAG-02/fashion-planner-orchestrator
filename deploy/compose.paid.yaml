# Paid-model layer — the ONLY file that references the OpenAI key.
#   deploy/bin/fashion-planner live "<planning brief>"   (refuses a second run; see LIVE_GUARD in bin/fashion-planner)
# Calls per run: the orchestrator's query structuring and SWOT draft, novelty's concept text and two draft
# images (product + worn outfit), and research's optional target-audience hypothesis. The inventory service
# makes no model call, and the orchestrator makes no image call: stage 06 composes the planning sheet locally.

services:
  orchestrator:
    environment:
      ORCHESTRATOR_QUERY_STRUCTURING_MODE: llm
      LLM_API_KEY: ${FASHION_PLANNER_OPENAI_API_KEY:?FASHION_PLANNER_OPENAI_API_KEY missing in the env file}
      LLM_MODEL: ${FASHION_PLANNER_ORCHESTRATOR_LLM_MODEL:?FASHION_PLANNER_ORCHESTRATOR_LLM_MODEL missing in the env file}

  novelty:
    environment:
      NOVELTY_DRAFT_IMAGE_PROVIDER: openai
      # novelty reads LLM_API_KEY for its two images and its LLM concept text.
      LLM_API_KEY: ${FASHION_PLANNER_OPENAI_API_KEY:?FASHION_PLANNER_OPENAI_API_KEY missing in the env file}
      # Blank means novelty's default image model.
      NOVELTY_DRAFT_IMAGE_MODEL: ${FASHION_PLANNER_NOVELTY_IMAGE_MODEL:-}
    networks: [backend, egress]

  research:
    environment:
      # research's optional target-audience hypothesis needs LLM_API_KEY and LLM_MODEL; without them it
      # records TARGET_AUDIENCE_LLM_FAILED and sends nothing. One paid call per review.
      # FASHION_PLANNER_RESEARCH_LLM_MODEL in the env file overrides the default model.
      LLM_API_KEY: ${FASHION_PLANNER_OPENAI_API_KEY:?FASHION_PLANNER_OPENAI_API_KEY missing in the env file}
      LLM_MODEL: ${FASHION_PLANNER_RESEARCH_LLM_MODEL:-gpt-6-luna}
      # Deployer opt-in: research sends the hypothesis inputs to the external LLM only when 1.
      RESEARCH_TARGET_LLM_TRANSFER_AUTHORIZED: ${RESEARCH_TARGET_LLM_TRANSFER_AUTHORIZED:-0}
