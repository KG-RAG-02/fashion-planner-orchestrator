# Deterministic offline layer: no egress, no R2, no Aura, no paid model.
#   deploy/bin/fashion-planner stub   (project "fashion-planner-stub", UI on 127.0.0.1:18765)
#
# * neo4j-stub   — throwaway Neo4j on tmpfs, seeded with the synthetic trend fixture graph
# * inventory    — synthetic fixture DuckDB built by the inventory image
# * novelty      — synthetic images (compose.yaml default), no model call
# * research     — bundled synthetic review source (labelled synthetic)
# * orchestrator — offline query structuring
# Stub query that exercises the whole chain:
#   "2027년 봄 발레코어에서 유행하는 핑크색 상의를 기획하고 싶어"

services:
  neo4j-stub:
    image: neo4j:5.26-community
    pull_policy: missing
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_STUB_PASSWORD:?run deploy/bin/fashion-planner init-env first}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_PLUGINS: "[]"
    tmpfs:
      - /data
      - /logs
    networks: [backend]
    mem_limit: 1536m
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  trend-stub-seed:
    image: fashion-planner/trend:dev
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m,mode=1777"]
    environment:
      HOME: /tmp
      NEO4J_URI: bolt://neo4j-stub:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_STUB_PASSWORD:?run deploy/bin/fashion-planner init-env first}
    # --allow-wipe: neo4j-stub is a throwaway tmpfs instance and may still hold the previous seed on re-up;
    # the script itself refuses managed hosts (*.neo4j.io), and NEO4J_URI here is fixed to neo4j-stub.
    command: ["python", "scripts/seed_fixture_graph.py", "--allow-wipe"]
    networks: [backend]
    restart: "no"
    depends_on:
      neo4j-stub: { condition: service_healthy }

  trend:
    environment:
      NEO4J_URI: bolt://neo4j-stub:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_STUB_PASSWORD:?run deploy/bin/fashion-planner init-env first}
    depends_on:
      trend-stub-seed: { condition: service_completed_successfully }

  inventory-fixture-init:
    image: fashion-planner/inventory:dev
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m,mode=1777"]
    environment:
      HOME: /tmp
    command: ["python", "-m", "fashion_planner_inventory.fixture_db", "/fixture/fixture.duckdb"]
    volumes:
      - inventory_fixture:/fixture
    restart: "no"
    depends_on:
      inventory-fixture-perms: { condition: service_completed_successfully }

  inventory-fixture-perms:
    image: fashion-planner/inventory:dev
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-c", "chown 10001:10001 /fixture && rm -f /fixture/fixture.duckdb /fixture/fixture.duckdb.wal"]
    volumes:
      - inventory_fixture:/fixture
    restart: "no"

  inventory:
    environment:
      INVENTORY_DB_PATH: /fixture/fixture.duckdb
    volumes:
      - inventory_fixture:/fixture:ro
    depends_on:
      inventory-fixture-init: { condition: service_completed_successfully }

  research:
    environment:
      # research answers from its bundled synthetic review data (no R2, DuckDB, FX API or LLM); the
      # result is labelled synthetic.
      RESEARCH_REVIEW_SOURCE: synthetic

  orchestrator:
    environment:
      ORCHESTRATOR_QUERY_STRUCTURING_MODE: synthetic_fixture
      # Stub is the integration-test profile: until the baseline is frozen the gate runs in
      # development mode and every result carries the 'not frozen; development run' limitation.
      ORCHESTRATOR_WORKFLOW_ALLOW_PROPOSED: "1"

volumes:
  inventory_fixture:
    name: fashion-planner_stub_inventory_fixture
