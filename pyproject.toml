[project]
name = "vogue-orchestrator"
version = "0.1.0"
description = "Proposal-stage orchestration core for the VOGUE planning pipeline"
requires-python = ">=3.11"

# The orchestration core stays stdlib-only. Only the query-structuring module
# (src/vogue_orchestrator/query) needs pydantic; install it with `pip install -e ".[query]"`.
[project.optional-dependencies]
query = ["pydantic>=2.0"]
# Real LLM call for query structuring (src/vogue_orchestrator/llm_provider.py); install the one
# matching LLM_MODEL in .env (a model name starting with "claude" uses Anthropic, others OpenAI).
llm-openai = ["openai"]
llm-anthropic = ["anthropic"]

[project.scripts]
vogue-orchestrator-ui = "vogue_orchestrator.server:serve"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
