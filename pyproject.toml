[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-planner-orchestrator"
version = "1.0.0"
description = "Fashion Planner의 다섯 서비스를 계약에 따라 순서대로 부르고 기획서를 만드는 오케스트레이터와 웹 UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "The Fashion Planner Contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Korean",
    "Private :: Do Not Upload",
]
# 오케스트레이션 핵심은 표준 라이브러리만 쓴다. 아래 extra는 기능별로 필요할 때만 설치한다.
dependencies = []

[project.optional-dependencies]
# 질의 구조화(src/fashion_planner_orchestrator/query)
query = ["pydantic>=2.0"]
# 계약 검증과 기획서 PNG
workflow = ["jsonschema>=4.18", "Pillow>=10"]
# 질의 구조화·SWOT의 실제 LLM 호출(src/fashion_planner_orchestrator/llm_provider.py). LLM_MODEL에 맞는 것 하나를
# 설치한다("claude"로 시작하면 Anthropic, 그 밖에는 OpenAI).
llm-openai = ["openai"]
llm-anthropic = ["anthropic"]

[project.urls]
Repository = "https://github.com/KG-RAG-02/fashion-planner-orchestrator"

[project.scripts]
fashion-planner-orchestrator = "fashion_planner_orchestrator.server:serve"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
